experiment_name: historical_smoke
description: Minimal smoke test for historical-weather bootstrap path.
start_datetime: '2025-06-10T00:00:00'

battery_capacities: [300.0]
threshold_values: [0.1]
wind_thresholds: [6.0]
horizons: [150]
failure_penalties: [5.0]
episodes: 100

transition_model: moderate
solar_panel_model: constant
whale_series: real
energy_increment_wh: 5
delta_t: 15
include_optimal: true
save_states: false
full_history_episodes: 0

locations:
- latitude: 30.0
  longitude: -90.0
  data_path: Data/EXPECTED_DATA/data_expected_lat30.0_lon-90.0_15min.pkl

wind_chain:
  enabled: false

historical_weather:
  enabled: true
  block_length_days: 7
