experiment_name: iid_small
description: >
  Small i.i.d. (memoryless-wind) validation sweep at lat30/lon-90:
  2 battery capacities x 2 wind thresholds, optimal + threshold policies.
start_datetime: '2020-04-01T00:00:00'

# --- sweep matrix (any list is a swept dimension) ---
battery_capacities: [300.0, 400.0]
threshold_values: [0.25]
wind_thresholds: [8.0, 12.0]
horizons: [150]
failure_penalties: [5.0]
episodes: 500

# --- model settings (fully describe behavior; no GUI/CLI flags needed) ---
transition_model: moderate
solar_panel_model: constant
whale_series: real
energy_increment_wh: 5
delta_t: 15
include_optimal: true
save_states: false
full_history_episodes: 0

locations:
- latitude: 30.0
  longitude: -90.0
  data_path: Data/EXPECTED_DATA/data_expected_lat30.0_lon-90.0_15min.pkl

# i.i.d. wind: persistence chain OFF (default).
wind_chain:
  enabled: false
