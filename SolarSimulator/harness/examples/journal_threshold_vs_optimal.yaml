experiment_name: journal_threshold_vs_optimal
description: >
  Reproduction of the AIAA Journal of Aircraft threshold-vs-optimal comparison
  (configs/final_journal_configs/threshold_sweep/observation_and_windspeed_threshold_config.yaml):
  sweep of observation x wind-speed thresholds for the threshold policy, with the optimal
  policy included for comparison. lat30/lon-75, horizon 3000, 3000 episodes, i.i.d. wind.
start_datetime: '2025-06-10T00:00:00'

# --- sweep matrix (matches the paper config) ---
battery_capacities: [300.0]
threshold_values: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3]
wind_thresholds: [0.0, 3.0, 6.0, 9.0, 12.0]
horizons: [3000]
failure_penalties: [5.0]
episodes: 3000

# --- model settings ---
transition_model: moderate
solar_panel_model: constant
whale_series: real
energy_increment_wh: 5
delta_t: 15
include_optimal: true          # threshold sweep + optimal baseline -> the comparison
save_states: false
full_history_episodes: 20

locations:
- latitude: 30.0
  longitude: -75.0
  data_path: Data/EXPECTED_DATA/data_expected_lat30.0_lon-75.0_15min.pkl

# i.i.d. wind (paper used the memoryless model).
wind_chain:
  enabled: false

# Reproduce this exact journal figure from the run's HDF5
# (Figures/Scripts/generate_journal_paper_figures.py::fig_threshold_sweep_combined).
paper_figure: fig_threshold_sweep_combined
