experiment_name: journal_threshold_vs_optimal_solarchain_historical
description: >
  Solar-chain-solved optimal policy vs threshold policy, both evaluated on real
  historical weather (block bootstrap).  The optimal policy is solved with the
  Markov-modulated clear-sky index (solar persistence); episodes are driven by the
  lat30/lon-90 historical record.  The solar question behind the wind result: do
  multi-day cloud spells, carried by the dusk->dawn regime channel, make the
  persistence-aware policy outperform the i.i.d. policy on real weather?  Enable
  wind_chain too for the joint wind+solar run (value table (n_b*n_g, |S|, T)).
start_datetime: '2025-06-10T00:00:00'

battery_capacities: [300.0]
threshold_values: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3]
wind_thresholds: [0.0, 3.0, 6.0, 9.0, 12.0]
horizons: [4000]
failure_penalties: [5.0]
episodes: 1000

transition_model: moderate
solar_panel_model: constant
whale_series: real
energy_increment_wh: 5
delta_t: 15
include_optimal: true
save_states: false
full_history_episodes: 0

locations:
- latitude: 30.0
  longitude: -90.0
  data_path: Data/EXPECTED_DATA/data_expected_lat30.0_lon-90.0_15min.pkl

# Solar-chain-solved optimal policy (stage-quantile clear-sky-index bins).
solar_chain:
  enabled: true
  n_bins: 3
  # path: Data/EXPECTED_DATA/data_expected_lat30.0_lon-90.0_15min_solarchain.pkl  # auto-derived

# Wind persistence OFF for the solar-only comparison; flip on for the joint run.
wind_chain:
  enabled: false

# Historical weather for episode rollouts.  The stage Betas / transition stack are
# automatically threaded through to the historical provider so realized GHI is
# digitized into the same quantile bins the solver used.
historical_weather:
  enabled: true
  block_length_days: 7
