experiment_name: cvi_capgrid_lat30.0_lon-90.0_iid_hist
description: '[apl_holdout_2026-10-20] Chain-vs-IID evaluation sweep ''capgrid'' at
  lat30.0_lon-90.0: iid-solved optimal policy, episodes on historical bootstrap weather.
  Paired with the other arm; configs differ only in wind_chain.enabled (weather draws
  are identical across the pair). HELD-OUT: Weibull/Beta table and wind chain fitted
  on 1950-2004, bootstrap cube from 2005-2022.'
battery_capacities:
- 150.0
- 300.0
- 500.0
horizons:
- 2880
start_datetime: '2020-07-01T00:00:00'
failure_penalties:
- 5.0
threshold_values: []
wind_thresholds: []
episodes: 3000
transition_model: moderate
solar_panel_model: constant
whale_series: real
energy_increment_wh: 5
delta_t: 15
include_optimal: true
save_states: false
full_history_episodes: 64
locations:
- latitude: 30.0
  longitude: -90.0
  data_path: Data/EXPECTED_DATA/data_expected_lat30.0_lon-90.0_15min_fit1950-2004.pkl
wind_chain:
  enabled: false
  n_bins: 4
  path: Data/EXPECTED_DATA/data_expected_lat30.0_lon-90.0_15min_fit1950-2004_windchain.pkl
historical_weather:
  enabled: true
  block_length_days: 7
  path: Data/EXPECTED_DATA/data_expected_lat30.0_lon-90.0_15min_eval2005-2022_histcube.pkl
