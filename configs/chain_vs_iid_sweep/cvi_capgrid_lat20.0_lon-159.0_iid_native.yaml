failure_penalties: [5.0]
threshold_values: []
wind_thresholds: []
episodes: 3000
transition_model: moderate
solar_panel_model: constant
whale_series: real
energy_increment_wh: 5
delta_t: 15
include_optimal: true
save_states: false
full_history_episodes: 0
locations:
- {latitude: 20.0, longitude: -159.0, data_path: Data/EXPECTED_DATA/data_expected_lat20.0_lon-159.0_15min.pkl}
wind_chain: {enabled: false, n_bins: 4}
