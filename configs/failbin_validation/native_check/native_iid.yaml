experiment_name: native_iid
description: >
  Sanity check: IID-optimal evaluated on its OWN (IID-sampled) world. On this world nothing
  may beat it; if best-threshold does, the IID solve is buggy rather than merely misspecified.
start_datetime: '2025-06-10T00:00:00'
battery_capacities: [300.0]
horizons: [2880]
failure_penalties: [20.0]
episodes: 20000
transition_model: moderate
solar_panel_model: constant
whale_series: real
energy_increment_wh: 5
delta_t: 15
save_states: false
full_history_episodes: 0
include_optimal: true
threshold_values: []
wind_thresholds: []
wind_chain:
  enabled: false
# NOTE: no historical_weather block -> rollouts sample the distributional (IID Weibull) model.
locations:
- latitude: 65.0
  longitude: -169.0
  data_path: Data/EXPECTED_DATA/data_expected_lat65.0_lon-169.0_15min.pkl
- latitude: 21.0
  longitude: -158.0
  data_path: Data/EXPECTED_DATA/data_expected_lat21.0_lon-158.0_15min.pkl
