experiment_name: smoke_jcs_capacity_lat30.0_lon-75.0_thresh_hist
description: 'Journal case ''capacity'' at lat30.0_lon-75.0: threshold-policy grid
  scored on the evaluation years (fit 1950-2002, episodes on 2003-2022); paired episode-for-episode
  with the optimal arms.'
episodes: 200
transition_model: moderate
solar_panel_model: constant
whale_series: JoA2026
energy_increment_wh: 5
delta_t: 15
include_optimal: false
save_states: false
full_history_episodes: 0
threshold_values: [0.1, 0.25]
wind_thresholds: [3.0, 6.0]
locations:
- {latitude: 30.0, longitude: -75.0, data_path: Data/EXPECTED_DATA/data_expected_lat30.0_lon-75.0_15min.pkl}
holdout:
  fit_years: [1950, 2002]
  eval_years: [2003, 2022]
  rollout_years: eval
wind_chain: {enabled: false, n_bins: 4}
battery_capacities: [250.0, 300.0]
horizons: [192]
failure_penalties: [5.0]
start_datetimes: ['2025-06-10T00:00:00']
historical_weather: {enabled: true, block_length_days: 7}
