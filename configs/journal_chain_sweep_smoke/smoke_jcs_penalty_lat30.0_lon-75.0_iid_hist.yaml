experiment_name: smoke_jcs_penalty_lat30.0_lon-75.0_iid_hist
description: 'Journal case ''penalty'' at lat30.0_lon-75.0: iid-solved optimal policy,
  episodes on held-out historical bootstrap weather (fit 1950-2002, episodes on 2003-2022).
  Paired with the other optimal arm; configs differ only in wind_chain.enabled.'
episodes: 200
transition_model: moderate
solar_panel_model: constant
whale_series: JoA2026
energy_increment_wh: 5
delta_t: 15
include_optimal: true
save_states: false
full_history_episodes: 0
threshold_values: []
wind_thresholds: []
locations:
- {latitude: 30.0, longitude: -75.0, data_path: Data/EXPECTED_DATA/data_expected_lat30.0_lon-75.0_15min.pkl}
holdout:
  fit_years: [1950, 2002]
  eval_years: [2003, 2022]
  rollout_years: eval
wind_chain: {enabled: false, n_bins: 4}
battery_capacities: [300.0]
horizons: [192]
failure_penalties: [5.0, 20.0]
start_datetimes: ['2025-06-10T00:00:00']
historical_weather: {enabled: true, block_length_days: 7}
