experiment_name: mkvdt60_bering_wind
description: 'Timestep-resolution check, arm ''wind'' @ bering: delta_t=60 min (native
  hourly weather, no interpolation), 60-day horizon (1440 steps). See docs/markov_ablation_experiment.md
  Phase 7.'
battery_capacities: [150.0, 300.0, 600.0]
horizons: [1440]
failure_penalties: [5.0, 20.0, 80.0]
threshold_values: []
wind_thresholds: []
episodes: 3000
transition_model: moderate
solar_panel_model: constant
whale_series: real
energy_increment_wh: 5
delta_t: 60
include_optimal: true
save_states: false
full_history_episodes: 0
locations:
- {latitude: 65.0, longitude: -169.0, data_path: Data/EXPECTED_DATA/data_expected_lat65.0_lon-169.0_60min.pkl}
historical_weather: {enabled: true, block_length_days: 7}
start_datetimes: ['2025-06-10T00:00:00', '2025-12-10T00:00:00']
wind_chain: {enabled: true, n_bins: 5, path: Data/EXPECTED_DATA/data_expected_lat65.0_lon-169.0_60min_windchain_wind5.pkl}
solar_chain: {enabled: false}
