experiment_name: mkvdt60s_florida_wind
description: 'dt60 smoke gate: wind arm @ florida, delta_t=60, 5-day horizon (120 steps).
  Must confirm the 60-min-fitted wind chain is NOT uniform (dt fit-gate fix) and the
  value table has 5 bins. See docs/markov_ablation_experiment.md Phase 7.'
battery_capacities: [300.0]
horizons: [120]
failure_penalties: [5.0]
threshold_values: []
wind_thresholds: []
episodes: 300
transition_model: moderate
solar_panel_model: constant
whale_series: real
energy_increment_wh: 5
delta_t: 60
include_optimal: true
save_states: false
full_history_episodes: 8
locations:
- {latitude: 27.0, longitude: -79.5, data_path: Data/EXPECTED_DATA/data_expected_lat27.0_lon-79.5_60min.pkl}
historical_weather: {enabled: true, block_length_days: 7}
start_datetime: '2025-06-10T00:00:00'
wind_chain: {enabled: true, n_bins: 5, path: Data/EXPECTED_DATA/data_expected_lat27.0_lon-79.5_60min_windchain_wind5.pkl}
solar_chain: {enabled: false}
