experiment_name: mkvsr_florida_solar_g6
description: 'Solar-resolution study: solar-only chain n_bins=6 @ florida, full conditions.
  Paired vs the same-condition iid.'
battery_capacities: [150.0, 300.0, 600.0]
horizons: [5760]
failure_penalties: [5.0, 20.0, 80.0]
threshold_values: []
wind_thresholds: []
episodes: 3000
transition_model: moderate
solar_panel_model: constant
whale_series: real
energy_increment_wh: 5
delta_t: 15
include_optimal: true
save_states: false
full_history_episodes: 8
locations:
- {latitude: 27.0, longitude: -79.5, data_path: Data/EXPECTED_DATA/data_expected_lat27.0_lon-79.5_15min.pkl}
historical_weather: {enabled: true, block_length_days: 7}
start_datetimes: ['2025-06-10T00:00:00', '2025-12-10T00:00:00']
wind_chain: {enabled: false}
solar_chain: {enabled: true, n_bins: 6, path: Data/EXPECTED_DATA/data_expected_lat27.0_lon-79.5_15min_solarchain_g6.pkl}
