experiment_name: jcsq16_startdate_lat-20.0_lon-75.0_thresh_hist
description: 'Journal case ''startdate'' at lat-20.0_lon-75.0: threshold-policy grid
  scored on the evaluation years (fit 1950-2002, episodes on 2003-2022, 7-day blocks);
  paired episode-for-episode with the optimal arms.'
episodes: 10000
transition_model: moderate
solar_panel_model: constant
whale_series: JoA2026
energy_increment_wh: 5
delta_t: 15
include_optimal: false
save_states: false
full_history_episodes: 0
threshold_values: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3]
wind_thresholds: [0.0, 3.0, 4.0, 5.0, 6.0, 8.0, 9.0, 12.0]
locations:
- {latitude: -20.0, longitude: -75.0, data_path: Data/EXPECTED_DATA/data_expected_lat-20.0_lon-75.0_15min.pkl}
holdout:
  fit_years: [1950, 2002]
  eval_years: [2003, 2022]
  rollout_years: eval
wind_chain: {enabled: false, n_bins: 16}
battery_capacities: [300.0]
horizons: [8500]
failure_penalties: [15.0]
start_datetimes: ['2025-01-01T00:00:00', '2025-03-01T00:00:00', '2025-05-01T00:00:00',
  '2025-07-01T00:00:00', '2025-09-01T00:00:00']
historical_weather: {enabled: true, block_length_days: 7}
