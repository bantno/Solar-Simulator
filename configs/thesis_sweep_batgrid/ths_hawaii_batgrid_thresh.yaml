experiment_name: ths_hawaii_batgrid_thresh
description: 'Thesis sweep ''batgrid'', arm ''thresh'' @ hawaii: 11 capacities x 6
  penalties x 2 seasons at 60 days. Paired on seed-0 bootstrap weather. See docs/markov_ablation_experiment.md
  section 8.'
battery_capacities: [100.0, 150.0, 200.0, 250.0, 300.0, 350.0, 400.0, 450.0, 500.0,
  550.0, 600.0]
horizons: [5760]
failure_penalties: [5.0]
threshold_values: [0.0, 0.1, 0.2, 0.3]
wind_thresholds: [0.0, 4.0, 8.0, 12.0]
episodes: 3000
transition_model: moderate
solar_panel_model: constant
whale_series: real
energy_increment_wh: 5
delta_t: 15
include_optimal: false
save_states: false
full_history_episodes: 0
locations:
- {latitude: 21.0, longitude: -158.0, data_path: Data/EXPECTED_DATA/data_expected_lat21.0_lon-158.0_15min.pkl}
historical_weather: {enabled: true, block_length_days: 7}
start_datetimes: ['2025-06-10T00:00:00', '2025-12-10T00:00:00']
wind_chain: {enabled: false}
solar_chain: {enabled: false}
