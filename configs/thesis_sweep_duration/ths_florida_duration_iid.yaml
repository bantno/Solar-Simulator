experiment_name: ths_florida_duration_iid
description: 'Thesis sweep ''duration'', arm ''iid'' @ florida: 6 mission durations
  (30-365 d) x 3 penalties at 300 Wh. Paired on seed-0 bootstrap weather. See docs/markov_ablation_experiment.md
  section 8.'
battery_capacities: [300.0]
horizons: [2880, 5760, 8640, 17280, 25920, 35040]
failure_penalties: [5.0, 20.0, 80.0]
threshold_values: []
wind_thresholds: []
episodes: 3000
transition_model: moderate
solar_panel_model: constant
whale_series: real
energy_increment_wh: 5
delta_t: 15
include_optimal: true
save_states: false
full_history_episodes: 8
locations:
- {latitude: 27.0, longitude: -79.5, data_path: Data/EXPECTED_DATA/data_expected_lat27.0_lon-79.5_15min.pkl}
historical_weather: {enabled: true, block_length_days: 7}
start_datetime: '2025-06-10T00:00:00'
wind_chain: {enabled: false}
solar_chain: {enabled: false}
