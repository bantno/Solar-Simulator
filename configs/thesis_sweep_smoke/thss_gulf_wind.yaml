experiment_name: thss_gulf_wind
description: 'Thesis smoke: Gulf of Mexico provisioning probe (histcube + 5-bin chain
  build) with a 5-day wind-arm solve.'
battery_capacities: [300.0]
horizons: [480]
failure_penalties: [20.0]
threshold_values: []
wind_thresholds: []
episodes: 300
transition_model: moderate
solar_panel_model: constant
whale_series: real
energy_increment_wh: 5
delta_t: 15
include_optimal: true
save_states: false
full_history_episodes: 0
locations:
- {latitude: 30.0, longitude: -90.0, data_path: Data/EXPECTED_DATA/data_expected_lat30.0_lon-90.0_15min.pkl}
historical_weather: {enabled: true, block_length_days: 7}
start_datetime: '2025-06-10T00:00:00'
wind_chain: {enabled: true, n_bins: 5, path: Data/EXPECTED_DATA/data_expected_lat30.0_lon-90.0_15min_windchain_wind5.pkl}
solar_chain: {enabled: false}
