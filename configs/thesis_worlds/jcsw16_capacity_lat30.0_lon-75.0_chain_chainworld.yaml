experiment_name: jcsw16_capacity_lat30.0_lon-75.0_chain_chainworld
description: 'Journal case ''capacity'' at lat30.0_lon-75.0: chain-solved (16-bin
  quantile wind chain) optimal policy rolled out in the chain model''s synthetic weather
  (fit 1950-2002); every policy in this world sees identical weather.'
episodes: 10000
transition_model: moderate
solar_panel_model: constant
whale_series: JoA2026
energy_increment_wh: 5
delta_t: 15
include_optimal: true
save_states: false
full_history_episodes: 0
threshold_values: []
wind_thresholds: []
locations:
- {latitude: 30.0, longitude: -75.0, data_path: Data/EXPECTED_DATA/data_expected_lat30.0_lon-75.0_15min.pkl}
holdout:
  fit_years: [1950, 2002]
  eval_years: [2003, 2022]
  rollout_years: eval
wind_chain: {enabled: true, n_bins: 16}
battery_capacities: [100.0, 150.0, 200.0, 250.0, 300.0, 350.0, 400.0, 450.0, 500.0,
  550.0, 600.0]
horizons: [3000]
failure_penalties: [5.0]
start_datetimes: ['2025-06-10T00:00:00']
synthetic_world: chain
