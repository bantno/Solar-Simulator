experiment_name: jcsw16_penalty_lat-30.0_lon-25.0_chain_iidworld
description: 'Journal case ''penalty'' at lat-30.0_lon-25.0: chain-solved (16-bin
  quantile wind chain) optimal policy rolled out in the iid model''s synthetic weather
  (fit 1950-2002); every policy in this world sees identical weather.'
episodes: 10000
transition_model: moderate
solar_panel_model: constant
whale_series: JoA2026
energy_increment_wh: 5
delta_t: 15
include_optimal: true
save_states: false
full_history_episodes: 0
threshold_values: []
wind_thresholds: []
locations:
- {latitude: -30.0, longitude: -25.0, data_path: Data/EXPECTED_DATA/data_expected_lat-30.0_lon-25.0_15min.pkl}
holdout:
  fit_years: [1950, 2002]
  eval_years: [2003, 2022]
  rollout_years: eval
wind_chain: {enabled: true, n_bins: 16}
battery_capacities: [300.0]
horizons: [3000]
failure_penalties: [0.0, 3.0, 5.0, 7.0, 10.0, 15.0, 20.0, 30.0, 40.0, 100.0]
start_datetimes: ['2025-06-10T00:00:00']
synthetic_world: iid
