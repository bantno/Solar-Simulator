experiment_name: wsel_lat20_lat20.0_lon-25.0_chain4_hist
description: 'Wind-bin study, case ''lat20'' at lat20.0_lon-25.0: optimal policy solved
  with a 4-bin quantile wind chain (fit 1950-1985), episodes on held-out historical
  weather 1986-2002.'
episodes: 10000
transition_model: moderate
solar_panel_model: constant
whale_series: JoA2026
energy_increment_wh: 5
delta_t: 15
include_optimal: true
save_states: false
full_history_episodes: 0
threshold_values: []
wind_thresholds: []
locations:
- {latitude: 20.0, longitude: -25.0, data_path: Data/EXPECTED_DATA/data_expected_lat20.0_lon-25.0_15min.pkl}
holdout:
  fit_years: [1950, 1985]
  eval_years: [1986, 2002]
  rollout_years: eval
wind_chain: {enabled: true, n_bins: 4}
battery_capacities: [100.0, 200.0, 300.0, 400.0, 500.0, 600.0]
horizons: [3000]
failure_penalties: [10.0]
start_datetimes: ['2025-01-01T00:00:00']
historical_weather: {enabled: true, block_length_days: 7}
