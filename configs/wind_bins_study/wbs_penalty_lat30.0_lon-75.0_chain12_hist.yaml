experiment_name: wbs_penalty_lat30.0_lon-75.0_chain12_hist
description: 'Wind-bin study, journal case ''penalty'' at lat30.0_lon-75.0: optimal
  policy solved with a 12-bin quantile wind chain (fit 1950-2002), episodes on held-out
  historical weather 2003-2022. Year-split hold-out by named files: holdout is false
  only because the artifact paths are explicit.'
episodes: 10000
transition_model: moderate
solar_panel_model: constant
whale_series: JoA2026
energy_increment_wh: 5
delta_t: 15
include_optimal: true
save_states: false
full_history_episodes: 0
threshold_values: []
wind_thresholds: []
locations:
- {latitude: 30.0, longitude: -75.0, data_path: Data/EXPECTED_DATA/data_expected_lat30.0_lon-75.0_15min_fit1950-2002.pkl}
holdout: false
wind_chain: {enabled: true, path: Data/EXPECTED_DATA/data_expected_lat30.0_lon-75.0_15min_fit1950-2002_windchain_q12.pkl,
  n_bins: 12}
battery_capacities: [300.0]
horizons: [3000]
failure_penalties: [0.0, 3.0, 5.0, 7.0, 10.0, 15.0, 20.0, 30.0, 40.0, 100.0]
start_datetimes: ['2025-06-10T00:00:00']
historical_weather: {enabled: true, block_length_days: 7, path: Data/EXPECTED_DATA/data_expected_lat30.0_lon-75.0_15min_eval2003-2022_histcube.pkl}
